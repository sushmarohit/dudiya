services:
  postgres:
    image: postgres:16
    container_name: milk-postgres
    environment:
      POSTGRES_DB: milk
      POSTGRES_USER: milk
      POSTGRES_PASSWORD: milk
    ports:
      - "5435:5432"
    volumes:
      - milk_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U milk -d milk"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  milk_pg_data:
